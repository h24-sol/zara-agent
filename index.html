<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ZARA | SOVEREIGN INTELLIGENCE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;400;700&display=swap');
        body { background: #000000; color: #00f2ff; font-family: 'JetBrains Mono', monospace; }
        .terminal-border { border: 1px solid rgba(0, 242, 255, 0.2); }
        .scanline { background: linear-gradient(to bottom, rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06)); background-size: 100% 2px, 3px 100%; pointer-events: none; position: fixed; inset: 0; }
        .zara-visual { filter: drop-shadow(0 0 20px rgba(0, 242, 255, 0.3)); transition: 0.3s; }
        .btn-active { background: #00f2ff; color: #000; box-shadow: 0 0 15px #00f2ff; }
    </style>
</head>
<body class="h-screen flex flex-col p-4 md:p-8 overflow-hidden">
    <div class="scanline"></div>

    <header class="flex justify-between items-center mb-6 terminal-border p-4 bg-black/50">
        <div class="flex flex-col">
            <h1 class="text-2xl font-bold tracking-[0.5em] uppercase">ZARA SOVEREIGN</h1>
            <span class="text-[10px] opacity-50 tracking-[0.2em]">LATENCY: 12ms | SYNC: GLOBAL_OVERSIGHT</span>
        </div>
        <div class="flex gap-4">
            <button id="en-btn" onclick="setLang('en')" class="btn-active border border-[#00f2ff] px-4 py-1 text-xs">EN</button>
            <button id="bn-btn" onclick="setLang('bn')" class="border border-[#00f2ff] px-4 py-1 text-xs">BN</button>
        </div>
    </header>

    <main class="flex-1 flex flex-col md:flex-row gap-6 overflow-hidden">
        <div class="w-full md:w-1/3 flex flex-col items-center justify-center terminal-border relative bg-zinc-950/20">
            <div id="visual-frame" class="w-72 h-96 relative overflow-hidden">
                <img src="https://i.ibb.co/LzhFvRz/zara-exec.jpg" class="zara-visual w-full h-full object-cover grayscale hover:grayscale-0 transition-all duration-1000" alt="ZARA">
                <div class="absolute inset-0 bg-blue-500/10 mix-blend-color"></div>
            </div>
            <div class="mt-4 p-4 text-center">
                <p id="zara-output" class="text-sm tracking-tight opacity-90 italic">"Global surveillance active. Feed initialized."</p>
            </div>
        </div>

        <div class="w-full md:w-2/3 flex flex-col gap-4 overflow-y-auto">
            <div class="terminal-border p-6 bg-black/40">
                <h2 class="text-xs font-bold uppercase mb-4 text-white">Current Market Liquidity & Geopolitics</h2>
                <div id="market-feed" class="space-y-4 font-light text-blue-100">
                    <p class="animate-pulse">Fetching 2026 Q1 Market Closure Data...</p>
                </div>
            </div>
            <div class="terminal-border p-6 bg-black/40">
                <h2 class="text-xs font-bold uppercase mb-4 text-white">Conflict & Intelligence Brief</h2>
                <div id="news-feed" class="space-y-4 font-light text-blue-100">
                    <p class="animate-pulse">Intercepting Global News Portals...</p>
                </div>
            </div>
        </div>
    </main>

    <footer class="mt-6">
        <div class="flex gap-4">
            <input id="command" type="text" placeholder="ENTER COMMAND..." 
                   class="flex-1 bg-transparent border border-[#00f2ff]/40 p-5 outline-none focus:border-[#00f2ff] transition-all uppercase placeholder:opacity-30">
            <button onclick="execute()" class="bg-[#00f2ff]/10 border border-[#00f2ff] px-12 py-5 font-bold hover:bg-[#00f2ff] hover:text-black transition-all">EXECUTE 🔥</button>
        </div>
    </footer>

    <script src="zara_sovereign.js"></script>
</body>
</html>
